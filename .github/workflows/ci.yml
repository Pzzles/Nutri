name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  deployment-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate deployment preflight contract
        run: |
          node --test scripts/deployment-preflight.test.mjs
          node scripts/deployment-preflight.mjs --local-only

  # ─── Web: typecheck + Vitest unit tests + production build ───────────────
  unit:
    runs-on: ubuntu-latest
    env:
      # Non-secret placeholders satisfy the Supabase client during tests and builds.
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Vitest unit + component tests
        run: npm test

      - name: Production build
        run: npm run build

  # ─── DB + RLS integration tests (requires local Supabase) ────────────────
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: supabase/tests/package-lock.json

      - name: Install DB test deps
        run: npm ci
        working-directory: supabase/tests

      - name: Start local Supabase
        run: supabase start

      - name: Export Supabase connection vars
        run: supabase status --output json | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"

      - name: Run DB + RLS integration tests
        run: npm test
        working-directory: supabase/tests

  # ─── Playwright mocked E2E (no real Supabase required) ──────────────────
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        run: npm ci
        working-directory: web

      - name: Install Playwright + Chromium
        run: npx playwright install chromium --with-deps
        working-directory: web

      - name: Run mocked Playwright tests
        run: npm run test:e2e:mocked
        working-directory: web

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-mocked
          path: web/playwright-report/
          retention-days: 7

  # ─── Playwright integration E2E (real Supabase + real edge functions) ────
  # Uses GROQ_API_KEY and optional FATSECRET_* repository secrets when present.
  # The external parse flow is explicitly skipped when GROQ_API_KEY is absent.
  e2e-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        run: npm ci
        working-directory: web

      - name: Install Playwright + Chromium
        run: npx playwright install chromium --with-deps
        working-directory: web

      - name: Inject edge function secrets
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FATSECRET_CONSUMER_KEY: ${{ secrets.FATSECRET_CONSUMER_KEY }}
          FATSECRET_CONSUMER_SECRET: ${{ secrets.FATSECRET_CONSUMER_SECRET }}
        run: |
          echo "GROQ_API_KEY=$GROQ_API_KEY" >> supabase/.env
          echo "FATSECRET_CONSUMER_KEY=$FATSECRET_CONSUMER_KEY" >> supabase/.env
          echo "FATSECRET_CONSUMER_SECRET=$FATSECRET_CONSUMER_SECRET" >> supabase/.env

      - name: Start local Supabase
        run: supabase start

      - name: Export Supabase connection vars
        run: supabase status --output json | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"

      - name: Run integration Playwright tests
        run: npm run test:e2e:integration
        working-directory: web
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-integration
          path: web/playwright-report/
          retention-days: 7
